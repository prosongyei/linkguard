<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkGuard Security Lab</title>
<style>
body {
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}
main {
    max-width: 550px;
    margin: auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 14px;
}
button {
    background: #16a34a;
    color: white;
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}
#result {
    margin-top: 20px;
    color: #86efac;
}
</style>
</head>
<body>
<main>
    <h1>LinkGuard</h1>
    <h3>Phishing Awareness Simulation</h3>

    <p>
        This demonstration records an authorized test click.
        It does not access your phone, passwords, Telegram,
        or private messages.
    </p>

    <label>
        <input type="checkbox" id="consent">
        I consent to this security test.
    </label>

    <p>
        <button onclick="runTest()">Run Test</button>
    </p>

    <div id="result"></div>
</main>

<script>
async function runTest() {
    const consent = document.getElementById("consent").checked;
    const result = document.getElementById("result");

    if (!consent) {
        result.textContent = "Consent is required.";
        return;
    }

    try {
        const response = await fetch("/click", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                consent: true,
                campaign: "linkguard-demo"
            })
        });

        const data = await response.json();
        result.textContent = data.message || data.error;
    } catch {
        result.textContent = "Connection failed.";
    }
}
</script>
</body>
</html>
